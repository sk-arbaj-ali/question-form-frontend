<section class="bg-linear-to-br from-slate-50 to-slate-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-6xl mx-auto">
            <div class=" flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-4xl font-bold text-slate-800 mb-2">Question Groups</h1>
                    <p class="text-slate-600">Manage your question groups and their status</p>
                </div>
                <div>
                    <button (click)="toggleAddQuestionModal(true)"
                        class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm font-medium transition-colors duration-150 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                            </path>
                        </svg>
                        Add New Group
                    </button>
                </div>
            </div>
            @if(isAddQuestionModalVisible()){
                <app-question-group-add-modal (showModal)="toggleAddQuestionModal(false)" />
            }
            @else if(isEditQuestionModalVisible()){
                <app-question-group-edit-modal (showEditModal)="toggleEditQuestionModal(false)" [id]="idForQuestionEdit()" />
            }
            <!-- <app-question-group-edit-modal [style.display]="showEditModal()" (showEditModal)="changeEditModalMode()" /> -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-linear-to-r from-slate-700 to-slate-800 text-white">
                                <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Question
                                    GroupID</th>
                                <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Status
                                </th>
                                <th class="px-6 py-4 text-center text-sm font-semibold uppercase tracking-wider">Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                            @for (item of qGroups(); track $index) {
                            <tr class="hover:bg-slate-50 transition-colors duration-150">
                                <td class="px-6 py-4 text-slate-900 font-medium">{{item?.groupName}}</td>
                                <td class="px-6 py-4">
                                    <span
                                        class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-emerald-100 text-emerald-800">
                                        {{item?.groupStatus}}
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center justify-center gap-2">
                                        <button (click)="toggleEditQuestionModal(true,item.id)"
                                            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors duration-150 flex items-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                                </path>
                                            </svg>
                                            Edit
                                        </button>
                                        <button (click)="deleteGroup(item.id)"
                                            class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-sm font-medium transition-colors duration-150 flex items-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                                </path>
                                            </svg>
                                            Delete
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
