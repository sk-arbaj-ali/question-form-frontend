<!-- Answer Options -->
<div class="space-y-6 bg-linear-to-br from-orange-50 to-amber-50 p-8 rounded-xl border-l-4 border-orange-500 mb-3">
    <h2 class="text-2xl font-bold text-orange-900 mb-6">Answer Options</h2>

    <div class="space-y-4" [formGroup]="formGroup">
        <div class="flex items-center gap-3 p-4 bg-white rounded-lg border border-orange-200">
            <input (change)="trackChange()" formControlName="correctAnswer" type="radio" value="1" class="w-5 h-5 text-orange-600" />
            <input formControlName="optionA" type="text" placeholder="Option A" class="flex-1 border-0 focus:ring-0 px-3 py-2">
            <!-- <span class="text-xs font-semibold text-orange-600 uppercase">Correct</span> -->
        </div>

        <div class="flex items-center gap-3 p-4 bg-white rounded-lg border border-orange-200">
            <input (change)="trackChange()" formControlName="correctAnswer" type="radio" value="2" class="w-5 h-5 text-orange-600" />
            <input formControlName="optionB" type="text" placeholder="Option B" class="flex-1 border-0 focus:ring-0 px-3 py-2">
        </div>

        <div class="flex items-center gap-3 p-4 bg-white rounded-lg border border-orange-200">
            <input (change)="trackChange()" formControlName="correctAnswer" type="radio" value="3" class="w-5 h-5 text-orange-600" />
            <input formControlName="optionC" type="text" placeholder="Option C" class="flex-1 border-0 focus:ring-0 px-3 py-2">
        </div>

        <div class="flex items-center gap-3 p-4 bg-white rounded-lg border border-orange-200">
            <input (change)="trackChange()" formControlName="correctAnswer" type="radio" value="4" class="w-5 h-5 text-orange-600" />
            <input formControlName="optionD" type="text" placeholder="Option D" class="flex-1 border-0 focus:ring-0 px-3 py-2">
        </div>
    </div>

</div>
