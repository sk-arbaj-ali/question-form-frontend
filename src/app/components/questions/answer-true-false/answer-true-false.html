        <form class="space-y-6" [formGroup]="subForm">
            <!-- Question 1 -->
            <div
                class="space-y-4 bg-linear-to-br from-cyan-50 to-blue-50 p-8 rounded-xl border-l-4 border-cyan-500 hover:shadow-lg transition duration-200">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <h3 class="text-lg font-bold text-cyan-900 mb-3">Correct Answer</h3>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <label
                        class="flex-1 flex items-center gap-3 p-4 bg-white rounded-lg border-2 border-cyan-200 hover:border-cyan-500 cursor-pointer transition group">
                        <input type="radio" formControlName="correctAnswer" (change)="trackChange()" value="true" class="w-5 h-5 text-green-600 accent-green-600">
                        <span class="text-gray-700 font-semibold group-hover:text-cyan-700">True</span>
                    </label>
                    <label
                        class="flex-1 flex items-center gap-3 p-4 bg-white rounded-lg border-2 border-cyan-200 hover:border-cyan-500 cursor-pointer transition group">
                        <input type="radio" formControlName="correctAnswer" (change)="trackChange()" value="false" class="w-5 h-5 text-red-600 accent-red-600">
                        <span class="text-gray-700 font-semibold group-hover:text-cyan-700">False</span>
                    </label>
                </div>
            </div>
        </form>

</div>
