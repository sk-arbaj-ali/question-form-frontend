<div
    class="bg-white shadow-xl rounded-2xl overflow-hidden max-w-4xl w-full flex flex-col md:flex-row border border-blue-50 mx-auto">

    <div class="md:w-1/2 bg-blue-500 p-10 text-white flex flex-col justify-center">
        <div class="flex items-center gap-2 mb-6">
            <div class="bg-white p-2 rounded-lg">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
            </div>
            <span class="text-2xl font-bold tracking-tight">CS EXAM</span>
        </div>
        <h1 class="text-3xl font-bold mb-4">Take The Examination Seriously</h1>
        <p class="text-blue-100 leading-relaxed">Access your question groups, track your progress, and manage your
            examinations in one place.</p>
    </div>

    <!-- <div class="md:w-1/2 p-8 md:p-12 bg-white"> -->

    <div class="flex items-center justify-center bg-[#f8fafc] p-6 md:w-1/2">
        <div class="w-full max-w-md bg-white rounded-2xl border border-blue-50 overflow-hidden">
            <div class="bg-white border-b border-gray-100 p-8 flex flex-col items-center">
                <div class="flex items-center gap-2 mb-2">
                    <div class="p-2 bg-blue-50 rounded-lg">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                            </path>
                        </svg>
                    </div>
                    <span class="text-xl font-bold text-gray-800 tracking-tight">CS EXAM</span>
                </div>
                <h2 class="text-2xl font-extrabold text-blue-600">Welcome Back</h2>
            </div>

            <form class="p-8 space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input formControlName="email" type="email" placeholder="Enter your email"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition-all placeholder:text-gray-400">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input formControlName="password" type="password" placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition-all">
                </div>

                <!-- <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-500 cursor-pointer">
                        <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        Remember me
                    </label>
                    <a href="#" class="text-blue-600 font-semibold hover:underline">Forgot password?</a>
                </div> -->

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-100 transition-all transform active:scale-[0.98]">
                    Login to Dashboard
                </button>
            </form>
        </div>
    </div>
<!-- </div> -->
</div>
