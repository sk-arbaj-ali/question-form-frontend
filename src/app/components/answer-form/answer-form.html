<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow-lg p-8 border-t-4 border-transparent bg-clip-padding"
        style="border-image: linear-gradient(to right, #06b6d4, #0891b2, #06b6d4) 1;">
        <div class="mb-8 bg-linear-to-r from-cyan-50 to-blue-50 p-6 rounded-lg border-l-4 border-cyan-500">
            <h1
                class="text-4xl font-bold bg-linear-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent mb-2">
                Take The Examination Seriously</h1>
            <p class="text-gray-700">Please take proper care to answer the following questions.</p>
        </div>

        <form class="space-y-8">
            <!-- Name -->
            <div class="space-y-4 bg-orange-50 p-6 rounded-lg border-l-4 border-orange-500">
                <label class="block">
                    <span class="text-lg font-semibold text-orange-900">1. What is your name?</span>
                    <input type="text"
                        class="mt-2 block w-full rounded-md border-orange-300 shadow-sm focus:border-orange-500 focus:ring-orange-500 px-4 py-2 border"
                        placeholder="Enter your name">
                </label>
            </div>

            <!-- Questions starts here -->
             @for (item of questions(); track $index) {
                @if(item.qType === 'mcq'){
                    <app-mcq-component 
                    [title]="item.title"
                    [text]="item.text"
                    [hints]="item.hints"
                    [marks]="item.marks"
                    [answers]="item.answers"
                    />
                }
                @else if(item.qType === 'multi'){
                    <app-msq-component
                    [title]="item.title"
                    [text]="item.text"
                    [hints]="item.hints"
                    [marks]="item.marks"
                    [answers]="item.answers"
                    />
                }
                @else if(item.qType === 'true-false'){
                    <app-true-false-component
                        [title]="item.title"
                        [text]="item.text"
                        [hints]="item.hints"
                        [marks]="item.marks"
                    />
                }
                @else {
                   <app-short-answer-component 
                    [title]="item.title"
                        [text]="item.text"
                        [hints]="item.hints"
                        [marks]="item.marks"
                   />
                }
             }
             <!-- Questions ends here -->

            <div class="pt-4">
                <button type="submit"
                    class="w-full bg-linear-to-r from-cyan-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-cyan-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 transition duration-200 shadow-lg">
                    Submit Paper
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Thank you for your time and feedback!
        </div>
    </div>
</div>
