<section class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
	<div class="w-full max-w-xl mx-4">
		<div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
			<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
				<h2 class="text-lg font-semibold text-slate-800">Add / Edit Question Group</h2>
				<button (click)="emitShowModal()" aria-label="close" class="text-slate-500 hover:text-slate-700">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
					</svg>
				</button>
			</div>

			<form class="px-6 py-6 space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()">
				<div>
					<label for="groupId" class="block text-sm font-medium text-slate-700 mb-1">Question Group ID</label>
					<input id="groupId" formControlName="groupName" type="text" placeholder="e.g. QG-006"
						class="block w-full rounded-md border border-slate-200 px-4 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-400" />
				</div>

				<div>
					<label for="status" class="block text-sm font-medium text-slate-700 mb-1">Status</label>
					<select id="status" formControlName="groupStatus"
						class="block w-full rounded-md border border-slate-200 px-4 py-2 text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-amber-200 focus:border-amber-400">
						<option value="draft">Draft</option>
						<option value="active">Active</option>
						<option value="pending">Pending</option>
						<option value="complete">Complete</option>
					</select>
				</div>

				<div class="flex items-center justify-end gap-3 pt-2">
					<button (click)="emitShowModal()" type="button"
						class="px-4 py-2 bg-slate-100 text-slate-800 rounded-lg text-sm font-medium hover:bg-slate-200 transition-colors">Cancel</button>
					<button type="submit"
						class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm font-medium transition-colors">Save Group</button>
				</div>
			</form>
		</div>
	</div>
</section>
