<section class="min-h-screen bg-linear-to-br from-slate-50 via-violet-50 to-pink-50 py-12">
    <div class="container mx-auto px-6">
        <div class="max-w-4xl mx-auto bg-white/70 rounded-2xl border border-slate-100 overflow-hidden">
            <div class="px-6 py-6 border-b border-slate-100">
                <h2 class="text-xl font-semibold text-slate-900">Answer Sheets</h2>
                <p class="text-sm text-slate-600 mt-1">List of students and quick actions to load their answer sheets.
                </p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-[600px]">
                    <thead>
                        <tr class="bg-linear-to-r from-slate-700 to-slate-800 text-white">
                            <th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">Student Name
                            </th>
                            <th class="px-6 py-4 text-center text-sm font-semibold uppercase tracking-wider">Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-200 bg-white">
                        @for (item of allStudents(); track $index) {
                        <tr class="hover:bg-slate-50 transition-colors duration-150">
                            <td class="px-6 py-4 text-slate-900 font-medium">{{item.name}}</td>
                            <td class="px-6 py-4 text-center">
                                <div class="inline-flex items-center gap-2">
                                    <button (click)="loadProvidedAnswers(item._id)"
                                        class="px-3 py-1 cursor-pointer bg-emerald-100 text-emerald-800 rounded-lg text-sm font-medium">Load</button>
                                </div>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
